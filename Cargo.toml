[package]
name = "tinybox"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
nix = { version = "0.29", features = ["process", "signal", "sched", "mount", "hostname", "fs", "term", "user"] }
seccompiler = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tar = "0.4"
reqwest = { version = "0.11", features = ["blocking", "json"] }
flate2 = "1.0"

[dev-dependencies]
tempfile = "3"
